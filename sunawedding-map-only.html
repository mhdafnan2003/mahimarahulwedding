<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map - P. Krishnapillai Memorial Auditorium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#faf8f4; --champagne:#c9a96e; --champagne-light:#e8d5b0; --champagne-dark:#a8874d; --beige:#f2ece2; --warm-gray:#8a7f74; --deep:#3d3530;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;}
  body{
    font-family:'Jost',sans-serif;
    background:var(--ivory);
    color:var(--deep);
    display:flex;align-items:center;justify-content:center;padding:3rem;
  }

  .map-wrapper{
    width:100%; max-width:900px; border-radius:6px; overflow:hidden; border:1px solid rgba(201,169,110,0.12);
    box-shadow:0 14px 60px rgba(201,169,110,0.08); aspect-ratio:16/7; background:linear-gradient(180deg, rgba(250,246,242,1) 0%, rgba(245,237,227,1) 100%);
    display:flex;align-items:center;justify-content:center;padding:1rem;
  }
  .map-link{display:block;width:100%;height:100%;text-decoration:none;color:inherit}
  .map-card{
    position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background: linear-gradient(180deg, rgba(242,236,226,0.8) 0%, rgba(232,213,176,0.6) 100%);
    color:var(--champagne-dark); overflow:hidden; padding:0 2rem;
  }
  .map-open-btn{position:absolute;top:18px;left:18px;background:linear-gradient(135deg,var(--champagne-light),var(--champagne));color:#fff;border:1px solid rgba(201,169,110,0.12);padding:0.45rem 0.6rem;border-radius:4px;font-size:0.9rem;box-shadow:0 6px 24px rgba(201,169,110,0.12)}
  .map-placeholder-content{display:flex;align-items:center;gap:1rem}
  .map-pin{font-size:1.8rem;color:var(--champagne-dark)}
  .map-text strong{display:block;font-family:'Cormorant Garamond',serif;font-size:1.05rem}
  .map-sub{font-size:0.9rem;color:rgba(15,59,63,0.65);margin-top:0.25rem}

  /* Make it look centered on narrow screens */
  @media (max-width:520px){
    .map-wrapper{padding:0.6rem}
    .map-text strong{font-size:0.95rem}
  }
</style>
</head>
<body>
  <div class="map-wrapper">
    <a class="map-link" href="https://www.google.com/maps/place/P.+Krishnapillai+Memorial+Auditorium/@11.2567,75.3456,15z" target="_blank" rel="noopener noreferrer">
      <div class="map-card">
        <span class="map-open-btn">Open in Maps ↗</span>
        <div class="map-placeholder-content">
          <div class="map-pin">📍</div>
          <div class="map-text">
            <strong>P. Krishnapillai Memorial Auditorium</strong>
            <div class="map-sub">Kovoor · May 31, 2026 · 4:00 PM</div>
          </div>
        </div>
      </div>
    </a>
  </div>
</body>
</html>
